<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Числовые выражения — Умный Бусел</title>
<link rel="stylesheet" href="lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
<style>#bHome { display: none; }</style>
</head>
<body>
<script src="lib/engine.js"></script>
<script src="audio/ru/timings.js"></script>
<script>
'use strict';
// Мультурок к теме 15 «Числовые выражения» приложения «Умный Бусел».
// Стиль — films-src/STYLE.md (эталон math-t12). Без вопросов: задания остаются в приложении.
// Цвета: скобки — голубой, умножение и деление — фиолетовый, сложение и вычитание — белый,
// номер действия и ответ — жёлтый, другой ответ при неверном порядке — розовый, подтверждение — мятный.
const CHAPTER = { number: 15, title: 'Числовые выражения', minutes: 4, language: 'ru' };

const BR = '#45d7f2', MUL = '#a495ff', GOLD = '#f6c453', REST = '#ff8c9c', OK = '#64ddb0', RED = '#ff7b7b', GREEN = '#7fd88a';

/* ---------- помощники (как в math-t12 / math-t13) ---------- */
const bT = (p, s, x, y, t, { size = 32, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => {
  const e = T(p, s, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t); return e;
};
const bTitle = (p, s, sub) => { bT(p, s, 100, 125, .15, { size: 46, weight: 600 }); if (sub) bT(p, sub, 100, 178, .3, { size: 28, fill: COL.dim }); };
// строка из кусков разного цвета: [['12 : ', null], ['3', SUM], …]
function bRich(p, parts, x, y, t, { size = 44, anchor = 'start', weight = 600 } = {}) {
  const e = mk('text', { 'font-size': size, 'font-family': UI, 'font-weight': weight, 'text-anchor': anchor, fill: COL.chalk }, p);
  e.style.whiteSpace = 'pre';
  parts.forEach(([s, c]) => { const ts = document.createElementNS(NS, 'tspan'); ts.textContent = s; if (c) ts.setAttribute('fill', c); e.appendChild(ts); });
  put(e, { x, y, o: 0 }); show(e, t); return e;
}
function bChip(p, v, x, y, t, color, { w = 84, h = 64, size = 34 } = {}) {
  const g = G(p, { x, y, o: 0 });
  g._r = mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 14, fill: COL.board, stroke: color, 'stroke-width': 3 }, g);
  g._t = T(g, String(v), { y: size * .36, size, fill: color, anchor: 'middle', weight: 600 });
  show(g, t, .35); return g;
}
const bPaint = (g, c, t) => { tw(g._r, { c_stroke: c }, t, .4); tw(g._t, { c_fill: c }, t, .4); };
function bBusel(p, pose, x, y, size, t) {
  const g = G(p, { x, y, o: 0, s: .94 });
  mk('image', { href: `img/busel-${pose}.webp`, x: -size / 2, y: -size / 2, width: size, height: size }, g);
  tw(g, { o: 1, s: 1 }, t, .7, out); return g;
}
// карточка с числом и проверкой (как «Проверь себя» в math-t12)
function bCard(p, x, y, w, h, t) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 24, fill: '#1b2540', stroke: COL.edge, 'stroke-width': 2 }, g);
  tw(g, { o: 1 }, t, .5); return g;
}
// квадратик-единица (для «десяток = девять и ещё один»)
function bCell(p, x, y, color, t, s = 40) {
  const g = G(p, { x, y, o: 0 });
  g._r = mk('rect', { x: -s / 2, y: -s / 2, width: s, height: s, rx: 7, fill: color }, g);
  show(g, t, .3); return g;
}

function bDots(p, n, color, { cx, cy, cols, gap = 56, r = 15, t = .3 }) {
  const rows = Math.ceil(n / cols);
  return Array.from({ length: n }, (_, i) => {
    const e = G(p, { x: cx + (i % cols - (cols - 1) / 2) * gap, y: cy + (Math.floor(i / cols) - (rows - 1) / 2) * gap, o: 0 });
    e._c = mk('circle', { r, fill: color }, e);
    mk('circle', { r: r * .3, cx: -r * .35, cy: -r * .35, fill: '#ffffff', 'fill-opacity': .55 }, e);
    show(e, t + i * .03, .3); return e;
  });
}
function bArrange(dots, cols, t, { cx, cy, gap = 56 }) {
  const rows = Math.ceil(dots.length / cols);
  dots.forEach((e, i) => tw(e, { x: cx + (i % cols - (cols - 1) / 2) * gap, y: cy + (Math.floor(i / cols) - (rows - 1) / 2) * gap }, t + i * .015, 1.1, io));
}
// выражение из кусочков: [['12', null], [' + ', null], …]; возвращает середины кусочков (для номеров действий)
function bExpr(p, toks, x, y, t, { size = 64, anchor = 'start', weight = 600, stagger = 0 } = {}) {
  ctx2d.font = `${weight} ${size}px ${UI}`;
  const ws = toks.map(([s]) => ctx2d.measureText(s).width);
  let cx = anchor === 'middle' ? x - ws.reduce((a, b) => a + b, 0) / 2 : x;
  const xs = [], els = [];
  toks.forEach(([s, c], i) => {
    const e = T(p, s, { x: cx, y, size, weight, fill: c || COL.chalk, o: 0 }); e.style.whiteSpace = 'pre';
    show(e, t + i * stagger, .4); els.push(e); xs.push(cx + ws[i] / 2); cx += ws[i];
  });
  return { els, xs, end: cx };
}
// номер действия над знаком
function bBadge(p, n, x, y, t, c = GOLD) {
  const g = G(p, { x, y, o: 0, s: .6 });
  mk('circle', { r: 22, fill: c }, g);
  T(g, String(n), { y: 9, size: 26, fill: '#11152a', anchor: 'middle', weight: 700 });
  tw(g, { o: 1, s: 1 }, t, .4, back); return g;
}
function bApple(p, x, y, c, t) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: 17, fill: c }, g);
  mk('circle', { r: 5, cx: -6, cy: -6, fill: '#ffffff', 'fill-opacity': .45 }, g);
  mk('path', { d: 'M0 -16q2 -9 9 -11', stroke: '#9b7650', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g);
  show(g, t, .3); return g;
}
function bBag(p, x, y, w, h, t) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 20, fill: '#1b2540', stroke: COL.edge, 'stroke-width': 2 }, g);
  show(g, t, .4); return g;
}
const PL = ' + ', MI = ' − ', MU = ' · ', DV = ' : ';

/* ---------- такты: [id, заголовок, run(m), доп.] ---------- */
const BEATS = [
  ['intro', 'Начало', (m) => {
    const p = panel(0);
    bBusel(p, 'wave', 270, 470, 470, .3);
    bT(p, 'МАТЕМАТИКА · ТЕМА 15', 580, 300, .2, { size: 26, fill: MUL, weight: 600 });
    bT(p, 'Числовые', 580, 400, .35, { size: 76, weight: 600 });
    bT(p, 'выражения', 580, 495, .5, { size: 76, weight: 600, fill: GOLD });
    bT(p, 'какое действие делать первым', 582, 580, m('sub'), { size: 34, fill: COL.dim });
  }],

  ['what', 'Что такое выражение', (m) => {
    const p = panel(0); bTitle(p, 'Что такое числовое выражение', 'Числа, знаки действий и скобки');
    const e = bExpr(p, [['3'], [MU, MUL], ['(', BR], ['12'], [PL], ['8'], [')', BR], [MI], ['5']], 200, 400, m('expr'), { size: 80, stagger: .12 });
    bT(p, 'числовое выражение', 200, 490, m('expr', 2), { size: 32, fill: COL.dim });
    bRich(p, [['= 3 · 20 − 5 = 60 − 5', COL.dim]], 200, 610, m('val'), { size: 44, weight: 500 });
    bExpr(p, [[' = ', null], ['55', GOLD]], e.end, 400, m('res'), { size: 80 });
    bT(p, 'значение выражения', e.end + 40, 490, m('res', .4), { size: 32, fill: GOLD, weight: 600 });
  }],

  ['trap', 'Что считать первым', (m) => {
    const p = panel(0); bTitle(p, 'Что считать первым?', '2 + 3 · 4');
    bExpr(p, [['2'], [PL], ['3'], [MU, MUL], ['4']], 120, 300, .4, { size: 72 });
    bRich(p, [['слева направо:  2 + 3 = 5,  5 · 4 = ', COL.dim], ['20', REST]], 120, 390, m('wrong'), { size: 36, weight: 500 });
    bApple(p, 170, 600, RED, m('apples')); bApple(p, 220, 600, RED, m('apples', .1));
    bT(p, '+', 300, 615, m('apples', .6), { size: 50, anchor: 'middle', weight: 600 });
    for (let b = 0; b < 3; b++) {
      const bx = 450 + b * 170;
      bBag(p, bx, 600, 140, 130, m('apples', 1 + b * .3));
      for (let i = 0; i < 4; i++) bApple(p, bx + (i % 2 ? 24 : -24), 600 + (i < 2 ? -24 : 24), RED, m('apples', 1.4 + b * .3 + i * .05));
    }
    bRich(p, [['3 · 4', MUL], [' = 12', null]], 620, 730, m('bags'), { size: 40, anchor: 'middle' });
    bRich(p, [['2 + 12 = ', null], ['14', GOLD], ['  ✓', OK]], 1000, 620, m('right'), { size: 56 });
    bT(p, 'умножение — раньше сложения', 1000, 710, m('right', 1.6), { size: 32, fill: MUL, weight: 600 });
  }],

  ['order', 'Порядок действий', (m) => {
    const p = panel(0); bTitle(p, 'Порядок действий', 'Три ступеньки');
    [['( )', 'действия в скобках', BR, 's1'], ['·  :', 'умножение и деление', MUL, 's2'], ['+  −', 'сложение и вычитание', COL.chalk, 's3']].forEach(([sym, txt, c, k], i) => {
      const g = G(p, { x: 140 + i * 200, y: 330 + i * 150, o: 0 });
      mk('rect', { x: 0, y: -55, width: 860, height: 110, rx: 22, fill: '#1b2540', stroke: c, 'stroke-width': 3 }, g);
      mk('circle', { cx: 60, cy: 0, r: 28, fill: GOLD }, g);
      T(g, String(i + 1), { x: 60, y: 11, size: 32, fill: '#11152a', anchor: 'middle', weight: 700 });
      T(g, sym, { x: 120, y: 15, size: 44, fill: c, weight: 700 });
      T(g, txt, { x: 260, y: 13, size: 40, weight: 600 });
      tw(g, { o: 1 }, m(k), .5);
    });
  }],

  ['left', 'Слева направо', (m) => {
    const p = panel(0); bTitle(p, 'Одна ступенька — слева направо', '24 : 6 · 2');
    const e = bExpr(p, [['24'], [DV, MUL], ['6'], [MU, MUL], ['2']], 120, 320, m('ex'), { size: 72 });
    draw(path(p, `M120 360H${e.end}`, { stroke: GOLD, 'stroke-width': 4, 'stroke-linecap': 'round' }, { d: 0 }), m('go'), .8);
    show(path(p, `M${e.end - 14} 350L${e.end} 360L${e.end - 14} 370`, { stroke: GOLD, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, { o: 0 }), m('go', .7), .2);
    bBadge(p, 1, e.xs[1], 230, m('d1')); bBadge(p, 2, e.xs[3], 230, m('d2'));
    bRich(p, [['24 : 6 = ', null], ['4', GOLD]], 120, 480, m('d1'), { size: 48 });
    bRich(p, [['4 · 2 = ', null], ['8', GOLD], ['  ✓', OK]], 120, 560, m('d2'), { size: 48 });
    bRich(p, [['с умножения:  6 · 2 = 12,  24 : 12 = ', COL.dim], ['2', REST], ['  — другой ответ', REST]], 120, 700, m('no'), { size: 36, weight: 500 });
  }],

  ['brackets', 'Скобки', (m) => {
    const p = panel(0); bTitle(p, 'Скобки меняют порядок', '(2 + 3) · 4');
    const e = bExpr(p, [['(', BR], ['2'], [PL], ['3'], [')', BR], [MU, MUL], ['4']], 120, 320, m('br'), { size: 72 });
    bBadge(p, 1, e.xs[2], 230, m('br', 1.2)); bBadge(p, 2, e.xs[5], 230, m('br', 1.5));
    for (let b = 0; b < 4; b++) {
      const bx = 230 + b * 230;
      bBag(p, bx, 520, 190, 140, m('bags', b * .3));
      [[-50, -24, RED], [0, -24, RED], [-50, 24, GREEN], [0, 24, GREEN], [50, 24, GREEN]].forEach(([dx, dy, c], i) => bApple(p, bx + dx + (dy < 0 ? 25 : 0), 520 + dy, c, m('bags', .3 + b * .3 + i * .05)));
    }
    bRich(p, [['2 + 3 = ', null], ['5', BR], ['  в каждом пакете', COL.dim]], 120, 680, m('five'), { size: 44 });
    bRich(p, [['5 · 4 = ', null], ['20', GOLD]], 120, 780, m('res'), { size: 56 });
  }],

  ['plan', 'Большой пример', (m) => {
    const p = panel(0); bTitle(p, 'Большой пример', 'Сначала расставим порядок');
    const e = bExpr(p, [['96'], [MI], ['(', BR], ['12'], [PL], ['8'], [')', BR], [MU, MUL], ['2'], [PL], ['18'], [DV, MUL], ['3']], 800, 470, m('ex'), { size: 72, anchor: 'middle', stagger: .25 });
    [[4, 1], [7, 2], [11, 3], [1, 4], [9, 5]].forEach(([k, n]) => bBadge(p, n, e.xs[k], 370, m('n' + n)));
    bT(p, 'одна ступенька — слева направо', 800, 600, m('n5', .6), { size: 32, fill: COL.dim, anchor: 'middle' });
  }],

  ['solve', 'Считаем по действиям', (m) => {
    const p = panel(0); bTitle(p, 'Считаем по действиям');
    const e = bExpr(p, [['96'], [MI], ['(', BR], ['12'], [PL], ['8'], [')', BR], [MU, MUL], ['2'], [PL], ['18'], [DV, MUL], ['3']], 800, 270, .2, { size: 52, anchor: 'middle' });
    [[4, 1], [7, 2], [11, 3], [1, 4], [9, 5]].forEach(([k, n]) => bBadge(p, n, e.xs[k], 200, .3));
    [['12 + 8 = ', '20'], ['20 · 2 = ', '40'], ['18 : 3 = ', '6'], ['96 − 40 = ', '56'], ['56 + 6 = ', '62']].forEach(([a, r], i) => {
      bBadge(p, i + 1, 560, 368 + i * 72, m('a' + (i + 1)));
      bRich(p, [[a, null], [r, i === 4 ? GOLD : BR]], 610, 384 + i * 72, m('a' + (i + 1)), { size: 44 });
    });
    bRich(p, [['Значение выражения: ', null], ['62', GOLD]], 800, 790, m('res'), { size: 48, anchor: 'middle' });
  }],

  ['words', 'Условие → выражение', (m) => {
    const p = panel(0); bTitle(p, 'Условие задачи — выражением', 'Слова подсказывают действие');
    const pill = (x, s, t) => { const g = G(p, { x, y: 270, o: 0 }); mk('rect', { x: -230, y: -38, width: 460, height: 76, rx: 38, fill: 'none', stroke: MUL, 'stroke-width': 3 }, g); T(g, s, { y: 12, size: 34, fill: MUL, anchor: 'middle', weight: 600 }); show(g, t, .4); };
    pill(380, 'сумма  →  +', m('sum')); pill(940, 'произведение  →  ·', m('prod'));
    bT(p, '«Из суммы 12 и 8 вычли 5»', 120, 420, m('ex1'), { size: 36, fill: COL.dim });
    const a = bExpr(p, [['(', BR], ['12'], [PL], ['8'], [')', BR], [MI], ['5']], 120, 500, m('ex1', 1.5), { size: 56 });
    bExpr(p, [[' = ', null], ['15', GOLD]], a.end, 500, m('r1'), { size: 56 });
    bT(p, '«К произведению 6 и 7 прибавили 10»', 120, 640, m('ex2'), { size: 36, fill: COL.dim });
    const b = bExpr(p, [['6'], [MU, MUL], ['7'], [PL], ['10']], 120, 720, m('ex2', 2), { size: 56 });
    bExpr(p, [[' = ', null], ['52', GOLD]], b.end, 720, m('r2'), { size: 56 });
    bT(p, 'скобки не нужны', b.end + 260, 715, m('r2', -1.5), { size: 32, fill: COL.dim });
  }],

  ['read', 'Читаем выражение', (m) => {
    const p = panel(0); bTitle(p, 'Как прочитать выражение', 'По последнему действию');
    const e = bExpr(p, [['120'], [MI], ['(', BR], ['73'], [PL], ['4'], [')', BR]], 800, 380, m('ex'), { size: 80, anchor: 'middle' });
    const ring = mk('circle', { cx: e.xs[1], cy: 354, r: 31, fill: 'none', stroke: GOLD, 'stroke-width': 4 }, p);
    put(ring, { o: 0 }); show(ring, m('last'), .4);
    bT(p, 'последнее действие', e.xs[1], 270, m('last', .3), { size: 30, fill: GOLD, anchor: 'middle', weight: 600 });
    const x0 = e.xs[0] - 70, x1 = e.xs[0] + 70, y = 420;
    draw(path(p, `M${x0} ${y}H${x1}`, { stroke: GOLD, 'stroke-width': 4, 'stroke-linecap': 'round' }, { d: 0 }), m('a'), .5);
    draw(path(p, `M${e.xs[2] - 20} ${y}H${e.xs[6] + 20}`, { stroke: BR, 'stroke-width': 4, 'stroke-linecap': 'round' }, { d: 0 }), m('b'), .5);
    bT(p, 'разность', 800, 540, m('name'), { size: 56, fill: GOLD, anchor: 'middle', weight: 600 });
    bRich(p, [['разность ', GOLD], ['числа 120', null]], 800, 650, m('a'), { size: 42, anchor: 'middle' });
    bRich(p, [['и суммы', BR], [' чисел 73 и 4', null]], 800, 720, m('b'), { size: 42, anchor: 'middle' });
  }],

  ['wrap', 'Повторим', (m) => {
    const p = panel(0); bTitle(p, 'Повторим');
    [['Сначала — действия в скобках', 'w1', BR], ['Потом умножение и деление', 'w2', MUL], ['В конце сложение и вычитание', 'w3', COL.chalk], ['Одна ступенька — слева направо', 'w4', GOLD]].forEach(([s, k, c], i) => {
      const g = G(p, { x: -16, y: 290 + i * 130, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 28, fill: c }, g);
      T(g, String(i + 1), { x: 150, y: 0, size: 32, fill: '#11152a', weight: 700, anchor: 'middle' });
      T(g, s, { x: 210, size: 40, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(k), .6);
    });
    bBusel(p, 'cheer', 1290, 520, 470, m('end'));
  }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
