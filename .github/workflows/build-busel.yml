name: Build Smart Busel installer

on:
  push:
    branches: ["**"]
    tags: ["busel-v*"]
    paths: ["smart-busel/**", ".github/workflows/build-busel.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ——— Windows: установщик .exe ———
  build:
    runs-on: windows-latest
    # обычно 2–3 минуты; если машина GitHub зависнет, сборка оборвётся через 20 минут, а не через часы
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-busel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-busel/package-lock.json
      - run: npm ci
      - run: npm run validate-content
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: umny-busel-installer
          # latest.yml — для автообновления на Windows (версия, имя файла и контрольная сумма SHA-512)
          path: |
            smart-busel/release/Umny-Busel-Setup-*.exe
            smart-busel/release/latest.yml
          if-no-files-found: error

  # ——— Android: APK (установить на телефон) и AAB (для Google Play) ———
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-busel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-busel/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      # Ключ подписи хранится только в секретах репозитория (Settings → Secrets and variables → Actions).
      # Без ключа собирается пробная версия: её можно поставить, но обновлять потом придётся с удалением.
      - id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/busel-release.jks"
            echo "file=$RUNNER_TEMP/busel-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — собирается пробная (debug) версия APK. Инструкция: README_ДЛЯ_РОДИТЕЛЯ.md, раздел «Android»."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Signed release build
        if: steps.key.outputs.signed == 'true'
        working-directory: smart-busel/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Test (debug) build
        if: steps.key.outputs.signed != 'true'
        working-directory: smart-busel/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Collect files
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-android
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-android/Umny-Busel-$version.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "release-android/Umny-Busel-$version.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-android/Umny-Busel-$version-test.apk"
          fi
          rm -f "$RUNNER_TEMP/busel-release.jks"
          ls -la release-android
      - uses: actions/upload-artifact@v4
        with:
          name: umny-busel-android
          path: smart-busel/release-android/*

  # ——— Выпуск на странице Releases: установщик для Windows и APK для Android ———
  # При слиянии в main: если выпуска busel-vX.Y.Z (версия из package.json) ещё нет — он создаётся;
  # если есть, но в нём не хватает файла (например, APK — ключ подписи добавили позже), файл дописывается.
  # Уже выложенные файлы не заменяются. Выпуск вручную по метке busel-v* работает так же.
  release:
    needs: [build, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/busel-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./smart-busel/package.json').version")
          tag="busel-v$version"
          # в выпуск — только установщик и подписанный APK (пробную версию и AAB людям не раздаём)
          rm -f out/*-test.apk out/*.aab
          ls -la out
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Выпуска $tag ещё нет — создаётся."
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Умный Бусел $version" \
              --notes "Что нового — в файле smart-busel/README_ДЛЯ_РОДИТЕЛЯ.md, раздел «Что нового в версии $version». Windows — Umny-Busel-Setup-$version.exe, Android — Umny-Busel-$version.apk."
          else
            have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in out/*; do
              name=$(basename "$f")
              if echo "$have" | grep -qxF "$name"; then echo "Уже есть: $name"; else echo "Дописывается: $name"; gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"; fi
            done
          fi
